# Local development stack. Start with `make dev` (copies .env.example -> .env on first run).
# Every value comes from .env; nothing secret is hard-coded here, and every externally visible URL
# is an .env value (WEB_ORIGIN, KEYCLOAK_PUBLIC_URL, S3_PUBLIC_ENDPOINT_URL). Addresses written
# here are Docker service names (keycloak, minio, web...), which resolve the same on any host.
# A server adds docker-compose.prod.yml on top (see infra/dev-vm/README.md).

name: skillifyme

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-false}
  DATABASE_URL: postgresql+asyncpg://skillify_app:${APP_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  MIGRATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  RELAY_DATABASE_URL: postgresql+asyncpg://skillify_relay:${RELAY_DB_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
  RELAY_DB_PASSWORD: ${RELAY_DB_PASSWORD:?}
  # The API/worker ask the web app to revalidate the static public catalog after a publish.
  WEB_INTERNAL_URL: http://web:3000
  REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  # The issuer is <KEYCLOAK_PUBLIC_URL>/realms/<realm>; containers fetch JWKS and call the admin
  # API over the Docker network.
  KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?}
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
  KEYCLOAK_INTERNAL_URL: http://keycloak:${KEYCLOAK_PORT:?}
  KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE:?}
  OIDC_ALLOWED_CLIENTS: ${OIDC_ALLOWED_CLIENTS:?}
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  S3_BUCKET: ${S3_BUCKET:?}
  # Presigned URLs are opened by the browser, so they name MinIO's browser-facing URL.
  S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:?}
  VIDEO_PROVIDER: ${VIDEO_PROVIDER:-local}
  VIDEO_UPLOAD_MAX_BYTES: ${VIDEO_UPLOAD_MAX_BYTES:-2147483648}
  VIDEO_UPLOAD_TTL_SECONDS: ${VIDEO_UPLOAD_TTL_SECONDS:-3600}
  VIDEO_PLAYBACK_TTL_SECONDS: ${VIDEO_PLAYBACK_TTL_SECONDS:-300}
  BUNNY_LIBRARY_ID: ${BUNNY_LIBRARY_ID:-}
  BUNNY_API_KEY: ${BUNNY_API_KEY:-}
  BUNNY_CDN_HOSTNAME: ${BUNNY_CDN_HOSTNAME:-}
  BUNNY_TOKEN_KEY: ${BUNNY_TOKEN_KEY:-}
  BUNNY_WEBHOOK_SECRET: ${BUNNY_WEBHOOK_SECRET:-}
  PROGRESS_FLUSH_INTERVAL_SECONDS: ${PROGRESS_FLUSH_INTERVAL_SECONDS:-30}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  # `make seed` (dev users) and `make migrate` (Keycloak's database, servers only).
  SEED_DEV_USERS: ${SEED_DEV_USERS:-false}
  DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
  KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
  KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
  KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-}
  # Windows/macOS bind mounts do not deliver inotify events into Linux containers.
  WATCHFILES_FORCE_POLLING: "true"

# Settings the realm template (infra/keycloak/realm.template.json) is rendered from.
x-realm-env: &realm-env
  KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
  KEYCLOAK_DISPLAY_NAME: ${KEYCLOAK_DISPLAY_NAME:-SkillifyMe Portal}
  WEB_ORIGIN: ${WEB_ORIGIN:?}
  KC_WEB_CLIENT_SECRET: ${KC_WEB_CLIENT_SECRET:?}
  KC_ADMIN_CLIENT_SECRET: ${KC_ADMIN_CLIENT_SECRET:?}
  KC_TEST_CLIENT_SECRET: ${KC_TEST_CLIENT_SECRET:-}
  KEYCLOAK_DEV_CLIENTS: ${KEYCLOAK_DEV_CLIENTS:-false}
  KEYCLOAK_BRUTE_FORCE: ${KEYCLOAK_BRUTE_FORCE:-true}
  SMTP_HOST: ${SMTP_HOST:?}
  SMTP_PORT: ${SMTP_PORT:?}
  SMTP_FROM: ${SMTP_FROM:?}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-SkillifyMe}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  SMTP_SSL: ${SMTP_SSL:-false}

services:
  # ------------------------------------------------------------------------------ data stores
  postgres:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200", "-c", "log_min_duration_statement=500"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # AOF + noeviction: buffered video heartbeats must survive restarts and never be evicted.
    # With a memory cap, a full Redis rejects writes (heartbeats fail loudly) instead of dropping
    # unflushed progress. Production Redis needs the same settings.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes community images to Docker Hub; Chainguard builds it from source.
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      # Browsers upload videos/PDFs straight to MinIO with presigned requests.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:?}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes: [minio-data:/data]
    healthcheck:
      # The Chainguard image has bash but no curl/grep: pure-bash HTTP probe.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /minio/health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          read -r status <&3 && [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MC_HOST_local: http://${MINIO_ROOT_USER:?}:${MINIO_ROOT_PASSWORD:?}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:-skillifyme-local}"]
    restart: "no"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.3.1
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://${KAFKA_EXTERNAL_HOST:?}:${KAFKA_PORT:-19092}
      - --schema-registry-addr=internal://0.0.0.0:8081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
    ports: ["${KAFKA_PORT:-19092}:19092"]
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.2.0
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
      SERVER_LISTENPORT: ${REDPANDA_CONSOLE_PORT:?}
    ports: ["${REDPANDA_CONSOLE_PORT:?}:${REDPANDA_CONSOLE_PORT:?}"]

  # ------------------------------------------------------------------------------ auth & mail
  keycloak-realm:
    # Renders the realm Keycloak imports on first start from .env (fails on a missing setting).
    image: python:3.13-alpine
    command: ["python", "/keycloak/realm.py", "render", "--out", "/import/skillifyme-realm.json"]
    environment: *realm-env
    volumes:
      - ./infra/keycloak:/keycloak:ro
      - keycloak-import:/import
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      # Same port inside and outside the container, so one KEYCLOAK_PORT drives every URL.
      KC_HTTP_PORT: ${KEYCLOAK_PORT:?}
      # Pin the issuer to the browser-facing URL. Tokens always carry
      # iss=<KEYCLOAK_PUBLIC_URL>/realms/<realm>, whichever host fetched them (browser, BFF over
      # the Docker network, tests). Backchannel calls may use the internal hostname.
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports: ["${KEYCLOAK_PORT:?}:${KEYCLOAK_PORT:?}"]
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-realm: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  keycloak-sync:
    # Re-applies the rendered settings to an existing realm (import skips it): redirect URIs, web
    # origins, SMTP, brute-force settings, missing clients and roles. Never deletes anything,
    # never rotates a client secret, never touches brute-force state (infra/keycloak/realm.py).
    image: python:3.13-alpine
    command: ["python", "/keycloak/realm.py", "sync", "--url", "http://keycloak:${KEYCLOAK_PORT:?}"]
    environment:
      <<: *realm-env
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    volumes:
      - ./infra/keycloak:/keycloak:ro
    depends_on:
      keycloak: { condition: service_healthy }
    restart: "no"

  keycloak-google:
    # Adds Google as an identity provider when GOOGLE_CLIENT_ID/SECRET are set; no-op otherwise.
    image: quay.io/keycloak/keycloak:26.6
    entrypoint: ["bash", "/scripts/configure-google.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:${KEYCLOAK_PORT:?}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - ./infra/keycloak/scripts:/scripts:ro
    depends_on:
      keycloak-sync: { condition: service_completed_successfully }
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.29
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------------------ application
  migrate:
    build: { context: ./apps/api, target: dev }
    image: skillifyme-api:dev
    environment: *api-env
    # Ensure the login roles (idempotent), then migrate.
    command: ["sh", "-c", "python -m app.cli.db_roles && alembic upgrade head"]
    volumes: ["./apps/api:/app"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  seed:
    # Idempotent dev data (SEED_DEV_USERS=true): dev users in Keycloak, orgs, batches, memberships.
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    command: ["python", "-m", "app.cli.seed"]
    volumes: ["./apps/api:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak-google: { condition: service_completed_successfully }
    restart: "no"

  seed-demo:
    # `make seed-demo`: demo logins, the Python Foundations course and progress (idempotent).
    # Passwords go only to ./.secrets/demo-credentials.txt (gitignored, mode 0600).
    image: skillifyme-api:dev
    pull_policy: never
    profiles: ["tools"]
    environment:
      <<: *api-env
      DEMO_CREDENTIALS_FILE: /secrets/demo-credentials.txt
    command: ["python", "-m", "app.cli.seed_demo"]
    volumes: ["./apps/api:/app", "./.secrets:/secrets"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      keycloak-sync: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: "no"

  api:
    # Built once by the migrate service; never pulled from a registry.
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./apps/api:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      seed: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes: ["./apps/api:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  beat:
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    # Schedule lives in app/worker.py (beat_schedule). Single instance only.
    command: ["celery", "-A", "app.worker", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes: ["./apps/api:/app"]
    depends_on:
      redis: { condition: service_healthy }

  outbox-relay:
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    command: ["python", "-m", "app.cli.outbox_relay"]
    volumes: ["./apps/api:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  # Enrolls / revokes students when they join or leave batches (identity.batch-members.v1).
  enrollment-consumer:
    image: skillifyme-api:dev
    pull_policy: never
    environment: *api-env
    command: ["python", "-m", "app.cli.enrollment_consumer"]
    volumes: ["./apps/api:/app"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"]
    environment:
      API_INTERNAL_URL: http://api:8000
      # Backend-for-frontend auth. Keycloak URLs derive from KEYCLOAK_PUBLIC_URL, like the API's.
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:?}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:?}
      KEYCLOAK_INTERNAL_URL: http://keycloak:${KEYCLOAK_PORT:?}
      OIDC_WEB_CLIENT_ID: ${OIDC_WEB_CLIENT_ID:?}
      KC_WEB_CLIENT_SECRET: ${KC_WEB_CLIENT_SECRET:?}
      WEB_ORIGIN: ${WEB_ORIGIN:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      # Local dev reads the public catalog fresh (no data cache); production/CI leave it unset.
      CATALOG_DATA_CACHE: "off"
      REDIS_URL: redis://redis:6379/1
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-20}
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes:
      - ./apps/web:/app
      # Container-owned node_modules/.next so they never mix with the host's (Windows) copies.
      - web-node-modules:/app/node_modules
      - web-next:/app/.next
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  redpanda-data:
  keycloak-import:
  web-node-modules:
  web-next:
  pnpm-store:
