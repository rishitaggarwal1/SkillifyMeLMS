name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------------------ API
  api:
    name: API · lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres, Redis, Redpanda
        working-directory: .
        # Same images and config as local dev; .env.example holds CI/local-only placeholders.
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis redpanda
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest
        # Fixtures create the DB roles and a migrated test database.
        run: uv run pytest

  # ------------------------------------------------------------------------------------------ Web
  web:
    name: Web · lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Generated API types are up to date
        working-directory: .
        run: make check-api-schema

  # ------------------------------------------------------------------------------------------ E2E
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Start backing services
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis redpanda
      - name: Prepare database
        working-directory: apps/api
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev python -m app.cli.db_roles
          uv run --no-dev alembic upgrade head
      - name: Start API
        working-directory: apps/api
        run: |
          nohup uv run --no-dev uvicorn app.asgi:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/api.log; exit 1

      - name: Build web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        env:
          API_INTERNAL_URL: http://127.0.0.1:8000
        run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: API log
        if: failure()
        run: cat /tmp/api.log

  # ------------------------------------------------------------------------------------------ Images
  docker:
    name: Docker image · ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: runtime
          push: false
          tags: skillifyme-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
