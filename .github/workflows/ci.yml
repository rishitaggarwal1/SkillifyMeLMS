name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------------------------ API
  api:
    name: API · lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - name: Start Postgres, Redis, Redpanda
        working-directory: .
        # Same images and config as local dev; .env.example holds CI/local-only placeholders.
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis redpanda keycloak minio mailpit
          docker compose run --rm minio-init
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .
      - name: Mypy (strict)
        run: |
          uv run mypy
          uv run mypy --strict ../../infra/keycloak/realm.py
      - name: Dev users in Keycloak (make seed)
        # The realm template has no users; the Keycloak integration tests sign in as the dev users
        # `make seed` creates (SEED_DEV_USERS=true in .env.example).
        run: |
          uv run python -m app.cli.db_roles
          uv run alembic upgrade head
          uv run python -m app.cli.seed
      - name: Pytest
        # Fixtures create the DB roles and a migrated test database.
        run: uv run pytest

  # ------------------------------------------------------------------------------------------ Web
  web:
    name: Web · lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: TypeScript
        run: pnpm typecheck
      - name: Vitest
        run: pnpm test
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Generated API types are up to date
        working-directory: .
        run: make check-api-schema

  # ------------------------------------------------------------------------------------------ E2E
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Start backing services
        run: |
          cp .env.example .env
          docker compose up -d --wait postgres redis redpanda keycloak minio mailpit
          docker compose run --rm minio-init
      - name: Prepare database
        working-directory: apps/api
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev python -m app.cli.db_roles
          uv run --no-dev alembic upgrade head
          uv run --no-dev python -m app.cli.seed
      - name: Demo seed, run twice (it must be idempotent)
        working-directory: apps/api
        # Throwaway passwords for this run's own Keycloak; the file never leaves the runner, and
        # the demo smoke spec turns Playwright tracing off so reports never contain them.
        env:
          DEMO_CREDENTIALS_FILE: ${{ github.workspace }}/.secrets/demo-credentials.txt
        run: |
          uv run --no-dev python -m app.cli.seed_demo
          uv run --no-dev python -m app.cli.seed_demo
      - name: Start API, worker and beat
        working-directory: apps/api
        # WEB_INTERNAL_URL: the web server runs on the runner, so publish-time catalog
        # revalidation goes there. Beat flushes buffered video progress (watched videos complete)
        # every few seconds instead of the default 30.
        env:
          WEB_INTERNAL_URL: http://127.0.0.1:3000
          PROGRESS_FLUSH_INTERVAL_SECONDS: "5"
        run: |
          nohup uv run --no-dev uvicorn app.asgi:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          nohup uv run --no-dev celery -A app.worker worker --loglevel=INFO > /tmp/worker.log 2>&1 &
          nohup uv run --no-dev celery -A app.worker beat --loglevel=INFO \
            --schedule=/tmp/celerybeat-schedule > /tmp/beat.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health/ready && exit 0
            sleep 1
          done
          cat /tmp/api.log; exit 1

      - name: Build web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install Playwright browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright
        working-directory: apps/web
        # The production server gets the same settings as local dev (.env from .env.example), with
        # host-side URLs because here the web server runs on the runner, not in Docker.
        run: |
          set -a; source ../../.env; set +a
          export API_INTERNAL_URL=http://127.0.0.1:8000 REDIS_URL=redis://localhost:6379/1
          export DEMO_CREDENTIALS_FILE="$GITHUB_WORKSPACE/.secrets/demo-credentials.txt"
          pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
      - name: API, worker and beat logs
        if: failure()
        run: cat /tmp/api.log /tmp/worker.log /tmp/beat.log

  # ------------------------------------------------------------------------------------------ Images
  docker:
    name: Docker image · ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          target: runtime
          push: false
          # The images docker-compose.prod.yml runs (API_IMAGE / WEB_IMAGE). Not pushed yet.
          tags: skillifyme-${{ matrix.app }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # ------------------------------------------------------------------------------------------ Server config
  server-config:
    name: Server config · compose override, Caddyfile, realm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Server-style .env from .env.dev-server.example (fake values on example.test)
        run: bash scripts/server_env_for_ci.sh > .env.server
      - name: docker compose config (docker-compose.yml + docker-compose.prod.yml)
        run: |
          compose="docker compose --env-file .env.server -f docker-compose.yml -f docker-compose.prod.yml"
          $compose config -q
          $compose --profile tools --profile debug config -q
          # Only Caddy publishes ports; no service bind-mounts application source.
          $compose --profile tools --profile debug config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          published = sorted(n for n, s in services.items() if s.get("ports"))
          assert published == ["caddy"], published
          for name, s in services.items():
              for v in s.get("volumes", []):
                  assert not (v["type"] == "bind" and v["source"].rstrip("/").endswith(("apps/api", "apps/web"))), name
          print("ok:", published)
          '
      - name: Realm renders for a server (no dev client, brute force on)
        run: |
          docker compose --env-file .env.server -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps -T keycloak-realm \
            sh -c 'python /keycloak/realm.py render --out /tmp/realm.json >&2 && cat /tmp/realm.json' \
            > realm.json
          python3 - <<'EOF'
          import json
          realm = json.load(open("realm.json"))
          assert realm["bruteForceProtected"] is True, "brute-force protection must be on"
          assert "skillifyme-test" not in {c["clientId"] for c in realm["clients"]}
          assert "localhost" not in json.dumps(realm)
          print("ok")
          EOF
      - name: caddy validate
        # A throwaway bcrypt hash (the env file carries a placeholder).
        run: |
          docker compose --env-file .env.server -f docker-compose.yml -f docker-compose.prod.yml \
            run --rm --no-deps -T --entrypoint sh caddy -c \
            'export MAILPIT_BASIC_AUTH_HASH="$(caddy hash-password --plaintext ci-only)" && caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile'
